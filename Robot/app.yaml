name: BX1 Robot Body
version: 10.42
icon: 🤖
description: Arduino UNO Q body client for BX1. Includes UNO Q RouterBridge recovery, Modulino Movement on Wire1/Qwiic, single-owner shared microphone streaming, Brain-owned dynamic wake phrases, local queued speech, portrait onboard touchscreen display, quiet-servo control, addressable LEDs and bounded hardware diagnostics.
